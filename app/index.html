<!doctype html>
<html lang="en" data-look="glass" data-theme="dark" data-accent="coral">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Los dos CDNs de carátulas: TMDB para series y cine, IGDB para juegos.
         Cada póster costaba ~65-90 ms y ~45 de ellos eran el DNS y el TLS de la
         PRIMERA conexión, que no empezaba hasta que el JS pedía la imagen. Aquí
         empiezan con el HTML, en paralelo con el bundle.

         Aviso para quien venga a medirlo: el ahorro NO se ha podido ver desde
         aquí. Ni en la app ni en una página estática de dos líneas, con Chrome
         y con Chromium, lanzando un navegador nuevo por vuelta, la carátula
         dejó de pagar su DNS+TLS (medido: 32 ms de TLS con y sin el `<link>`).
         Puede ser el banco —un navegador automatizado, todo por localhost, la
         caché de DNS del sistema caliente— o puede ser que aquí no sirva de
         nada. Se deja porque no cuesta nada y en una conexión fría sí ayuda,
         pero nadie ha visto el número en esta casa: si alguien lo mide de
         verdad, que corrija este párrafo.

         SIN `crossorigin` a propósito, aunque el atributo se vea en casi todos
         los ejemplos: un `<img>` normal no pide CORS, así que su conexión va en
         el pozo de credenciales "incluidas". `crossorigin` precalienta la
         ANÓNIMA, que es otra entrada del pozo, y el navegador abriría una
         segunda conexión para las imágenes — el preconnect no ahorraría nada y
         encima costaría un handshake de más. Solo llevaría `crossorigin` si de
         aquí saliera algo pedido con CORS: fuentes, fetch() o módulos. -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://images.igdb.com" />
    <meta name="theme-color" content="#0b0d12" />
    <meta
      name="description"
      content="Reel keeps every show you follow in one place — what's next, when it returns, and what your friends thought of it. Invite-only beta."
    />
    <meta property="og:title" content="Reel — Always know what to watch tonight" />
    <meta
      property="og:description"
      content="Track your shows, follow the calendar, compare tastes with friends and import your whole TV Time history."
    />
    <meta property="og:type" content="website" />
    <title>Reel — Always know what to watch tonight</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
