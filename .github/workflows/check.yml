name: check

on:
  push:
    branches: [main]
  pull_request:

# A superseded run's verdict is worthless — only the newest commit's counts.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check

  # Dos ramas abiertas a la vez miran el último número de supabase/migrations y
  # eligen el siguiente; la primera en fusionarse gana y la segunda no lo
  # descubre hasta que `db push` falla contra PRODUCCIÓN con un 23505 sobre
  # schema_migrations. Pasó el 24-ago-2026 con dos 0071 (videojuegos y avisos de
  # cine). Aquí cuesta un segundo y falla en la PR, que es donde se arregla sin
  # tocar nada aplicado.
  migrations:
    runs-on: ubuntu-latest
    # `packages: read` es para el login en ghcr.io de más abajo. Declarar
    # `permissions` en un job deja a cero todo lo que no se nombra, así que
    # `contents: read` va explícito o `checkout` se queda sin poder leer el repo.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Un número de migración, un fichero
        run: |
          dupes=$(ls supabase/migrations/*.sql \
            | xargs -n1 basename \
            | cut -d_ -f1 \
            | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Números de migración repetidos: $dupes"
            ls supabase/migrations/*.sql | xargs -n1 basename | grep -E "^($(echo "$dupes" | paste -sd'|' -))_"
            echo
            echo "El que se renumera es el que NO esté aplicado en la base hosted:"
            echo "un número ya registrado en supabase_migrations.schema_migrations"
            echo "no se puede renombrar sin tocar a mano el registro de producción."
            exit 1
          fi
          echo "sin repetidos: $(ls supabase/migrations/*.sql | wc -l | tr -d ' ') migraciones"

      # Las matrices de supabase/sql-checks llaman a las funciones de la base y
      # comprueban lo que devuelven. Hasta hoy solo corrían a mano, o sea cuando
      # alguien se acordaba: la PR #132 (migración 0098) reescribió
      # `rpc_library_rollup` desde una versión vieja y le quitó dos columnas, y
      # este workflow salió verde porque nada aquí llegaba a llamarla.
      #
      # Se levanta la base desde CERO, que de paso es la única prueba de que las
      # migraciones aplican en orden sobre una base limpia, y se corren todas con
      # el mismo guión que usa ./verificar.sh — el mismo y no una copia, que es
      # como no acaban diciendo cosas distintas.
      #
      # El CLI va clavado por lo mismo que en e2e.yml: con `latest`, una versión
      # nueva rompe este job sin que nadie haya tocado el repo.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      # `supabase start` baja unas nueve imágenes de ghcr.io, y sin identificarse
      # las baja del cupo ANÓNIMO, que comparten todos los runners de GitHub. El
      # 23-sep-2026 ese cupo estuvo saturado toda la tarde y este job cayó tres
      # veces seguidas antes de aplicar una sola migración —
      # «toomanyrequests: … allowed: 44000/minute» en cada imagen—, con las
      # mismas imágenes y el mismo CLI que el día anterior salieron en verde.
      # Identificado con el token del propio workflow, la descarga va por el
      # cupo de la cuenta y no por el compartido. Las imágenes son públicas: el
      # login no da acceso a nada, solo cambia de qué cupo se descuenta.
      - name: Identificarse en ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Los nombres de `-x` son los que el CLI documenta —`supabase start --help`
      # los lista— y no los de los contenedores: escribir `mailpit` o
      # `supavisor`, que es como se llaman por fuera, no excluye nada. Fuera va
      # lo que ninguna migración ni matriz toca; `db` y los esquemas en los que
      # sí escriben migraciones (auth, storage, realtime) se quedan.
      - name: Levantar la base y aplicar las migraciones
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,functions,vector,analytics
      - name: Matrices SQL
        run: supabase/sql-checks/correr.sh

  # The Deno edge functions aren't covered by the app's tsc or vitest — type-check
  # them here so the unattended crons + importer can't ship a type error (audit
  # D2), and run whatever *_test.ts they carry. Function logic worth testing goes
  # in a sibling module (index.ts serves on import, so it can't be imported by a
  # test) — see tmdb-proxy/rank.ts.
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        run: |
          for dir in supabase/functions/*/; do
            f="${dir}index.ts"
            [ -f "$f" ] || continue
            cfg="${dir}deno.json"
            if [ -f "$cfg" ]; then
              echo "deno check (config) $f"
              deno check --config "$cfg" "$f"
            else
              echo "deno check $f"
              deno check "$f"
            fi
          done
      - name: Test edge functions
        # No test files is a pass, not a failure — most functions have none yet.
        run: deno test --permit-no-files supabase/functions/

  # Las matrices de los crones de scripts/, que hasta hoy no corría NADIE.
  #
  # Seis paquetes tienen `lib.test.ts` —las decisiones de cada cron, separadas
  # de la red para poder probarlas— y ninguno pasaba por el CI: se ejecutaban a
  # mano, o sea cuando alguien se acordaba. Es el mismo agujero que tapó
  # `sql-checks/correr.sh` para las matrices SQL, y la misma frase vale aquí:
  # una prueba que no corre sola no es una red. Lo que lo destapó fue 0103, que
  # mete en steam-notes la lógica de corregir un appid — código que decide qué
  # se escribe en `titles` y que nadie habría vuelto a ejecutar.
  #
  # Un paquete sin `test` en su package.json no suspende: tvtime-import no
  # tiene matriz todavía, y exigirla aquí sería mezclar dos cosas. Lo que sí se
  # le pide a todos es el `typecheck`.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Matrices y tipos de los crones
        run: |
          rojo=0
          for dir in scripts/*/; do
            [ -f "${dir}package.json" ] || continue
            echo "── $dir"
            ( cd "$dir" && npm ci --silent ) || { rojo=1; continue; }
            if grep -q '"test"' "${dir}package.json"; then
              ( cd "$dir" && npm test ) || rojo=1
            fi
            ( cd "$dir" && npm run typecheck ) || rojo=1
          done
          exit $rojo
