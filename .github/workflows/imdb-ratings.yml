name: imdb-ratings

# Hourly IMDb rating import from the official datasets (scripts/imdb-ratings).
#
# It runs here rather than as an edge function because the input is a ~52 MB
# gzipped TSV with ~8.5M rows: the script streams it, but a runner has the time
# and memory headroom to do that comfortably and an edge invocation does not.
#
# Hourly, at :00. It is the ONLY writer of imdb_rating / imdb_votes now (OMDb
# was removed for being stale), so its cadence decides how long a show waits for
# a rating — not how fresh the data is, since IMDb publishes once a day. What
# the cadence really measures is the wait after someone first OPENS a show:
# tmdb-proxy ingests the episode rows on the spot and they stay unrated until
# the next run here, so daily meant up to 24h with no episode graph. Hourly cuts
# that to one. What keeps a just-aired episode's volatile score out is
# MIN_AGE_DAYS, not the schedule.
#
# It was daily while the repo was private, where 24 runs/day of runner time is
# billed. The repo is public since then and the minutes are free, which was the
# only objection on record.
#
# SECRETS (repo → Settings → Secrets and variables → Actions):
#   SUPABASE_URL                — https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   — Dashboard → Project Settings → API
# Without them the job fails loudly on the first run rather than writing nothing
# silently.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change, write nothing"
        type: boolean
        default: false
      min_votes:
        description: "Ignore ratings under this many votes"
        default: "20"
      min_age_days:
        description: "Skip episodes that aired more recently than this"
        default: "7"

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/imdb-ratings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Import IMDb ratings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIN_VOTES: ${{ inputs.min_votes || '20' }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days || '7' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: npm start
