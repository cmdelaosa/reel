name: diagnostico-steam

# TEMPORAL, segunda pasada. La primera ya contestó la pregunta:
#
#   curl x10           -> 200, 200, 200, 200, 200, 200, 200, 200, 200, 200
#   fetch de Node x10  -> 429, 429, 429, 429, 429, 429, 429, 429, 429, 429
#   fetch + UA Chrome  -> 200, 200, 200, 200, 200, 200, 200, 200, 200, 200
#
# Misma IP (20.3.231.117), mismo segundo, misma URL, mismo ritmo. No es la IP
# compartida ni el cupo: es el User-Agent. `fetch` de Node manda «node» y
# `curl` manda «curl/8.5.0», y Steam corta al primero.
#
# Lo que queda por decidir es CUÁL ponerle, y no es cosmético: imitar a Chrome
# es mentir sobre quién llama, y aquí no hace falta si Steam solo está filtrando
# el «node» pelado — `curl/8.5.0` no es un navegador y pasa. Esta pasada mide
# tres candidatos para poder elegir el honesto con datos y no con fe.
#
# Se borra en cuanto conteste. Corre al empujar este fichero, porque
# `workflow_dispatch` solo se lanza desde la rama por defecto.

on:
  push:
    paths:
      - ".github/workflows/diagnostico-steam.yml"

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ¿Qué User-Agent acepta Steam?
        run: |
          cat > /tmp/ua.mjs <<'JS'
          const name = 'AK-47 | Redline (Field-Tested)';
          const url = 'https://steamcommunity.com/market/priceoverview/?appid=730&currency=3'
            + '&market_hash_name=' + encodeURIComponent(name);
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          /* De más honesto a menos. El primero que aguante seis seguidas gana. */
          const CANDIDATOS = [
            ['nuestro',      'Reel/1.0 (+https://reel-app.com)'],
            ['nuestro largo','Reel/1.0 (cron de precios de mercado; +https://reel-app.com)'],
            ['curl',         'curl/8.5.0'],
            ['node (control)', null],
          ];

          for (const [etiqueta, ua] of CANDIDATOS) {
            const codes = [];
            for (let i = 0; i < 6; i++) {
              try {
                const res = await fetch(url, {
                  headers: ua ? { 'user-agent': ua } : {},
                  signal: AbortSignal.timeout(15000),
                });
                codes.push(res.status);
              } catch (e) {
                codes.push('ERR');
              }
              await sleep(700);
            }
            console.log(`  ${etiqueta.padEnd(16)} ${JSON.stringify(ua)} -> ${codes.join(', ')}`);
          }
          JS
          node /tmp/ua.mjs
