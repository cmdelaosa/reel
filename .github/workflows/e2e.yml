name: e2e

# Not per-push (it needs a full Supabase stack + TMDB). Manual + nightly.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * *" # 05:37 UTC nightly

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start
        working-directory: .

      - name: Serve tmdb-proxy
        working-directory: .
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          nohup supabase functions serve tmdb-proxy --env-file <(echo "TMDB_API_KEY=$TMDB_API_KEY") > /tmp/functions.log 2>&1 &
          sleep 5

      - name: Seed a password-enabled, invited + onboarded test user
        working-directory: .
        run: |
          SR=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')
          API=http://127.0.0.1:54321
          UID=$(curl -s -X POST $API/auth/v1/admin/users -H "apikey: $SR" -H "Authorization: Bearer $SR" -H "Content-Type: application/json" \
            -d '{"email":"e2e@example.com","password":"password123","email_confirm":true,"user_metadata":{"name":"E2E Tester"}}' | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          docker exec -i $(docker ps --format '{{.Names}}' | grep supabase_db) psql -U postgres -d postgres -c \
            "insert into public.invites(code, used_by) values ('E2E-SEED', '$UID'); update public.profiles set handle='e2etester', display_name='E2E Tester' where id='$UID';"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run e2e
        env:
          E2E_EMAIL: e2e@example.com
          E2E_PASSWORD: password123
          E2E_ANON_KEY: ""
        run: |
          export E2E_ANON_KEY=$(cd .. && supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
