name: steam-prices

# Refresco diario de los precios del mercado de Steam y la foto del inventario
# (migración 0085, guión scripts/steam-prices).
#
# ── Por qué el trabajo corre AQUÍ y no en una edge function ──────────────
# Porque Steam elige por IP a quién le contesta, y a la de las edge functions de
# Supabase no le contesta. La misma petición, el 27-08-2026, contra producción:
#
#   · desde la edge function:     429 a la primera, cero precios traídos;
#   · desde un runner de GitHub:  5 de 5 con 200 y precios reales;
#   · desde una IP doméstica:     12 seguidas sin un corte.
#
# La primera versión de esto era un bucle de `curl` contra una ruta `/prices` de
# la función, y habría devuelto ceros todas las noches sin que nada fallara. El
# primer paso de abajo vuelve a tomar esa medida en cada ejecución, para que el
# día que Steam cambie de idea se vea en el registro y no haya que deducirlo.
#
# ── Por qué NO refresca el inventario ────────────────────────────────────
# Porque no puede, ni desde aquí. `/inventory/<steamid>/…` está estrangulado
# mucho más fuerte —429 hasta a la primera petición desde una IP doméstica
# limpia— y encima `pricehistory` y `myhistory` piden la cookie de sesión. Lo que
# tienes lo sube el recolector desde tu propio navegador, de uvas a peras. Lo que
# cambia a diario no es lo que tienes: es lo que vale.
#
# A las 4:10 UTC: después de que el mercado europeo se calme, y a una hora en la
# que un 429 no le estropea la pantalla a nadie. El minuto raro es para no caer
# en el pico de trabajos programados en punto.
#
# SECRETS (repo → Settings → Secrets and variables → Actions):
#   SUPABASE_URL                — https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   — la sb_secret_… (SUPABASE_DEFAULT_KEY en el
#                                 CLI), no el JWT service_role legacy: ver
#                                 docs/DEPLOY.md.
# Sin ellos el guión se planta en la primera línea en vez de escribir nada en
# silencio.

on:
  schedule:
    - cron: "10 4 * * *"
  # TEMPORAL — se quita antes de fusionar. Para preguntarle al runner, desde la
  # PR, si Steam le deja leer INVENTARIOS y no solo precios. De la respuesta
  # depende que haya que pegar código o no, y `workflow_dispatch` no se puede
  # lanzar desde una rama.
  pull_request:
    paths:
      - ".github/workflows/steam-prices.yml"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Tope de precios que pedir en esta pasada"
        default: "1500"

# `checkout` necesita leer el repo, y con `permissions: {}` el token va sin un
# solo permiso. En un repo público suele colar y ese "suele" es justo lo que no
# se quiere en un cron que corre de madrugada sin nadie mirando.
permissions:
  contents: read

jobs:
  # TEMPORAL — se quita antes de fusionar.
  #
  # La pregunta que decide si hace falta pegar código: ¿le deja Steam a este
  # runner leer un INVENTARIO? Los precios ya sabemos que sí. El inventario está
  # estrangulado mucho más fuerte y desde una IP doméstica contesta 429 hasta a
  # la primera petición.
  #
  # Va con un SteamID64 sintético —el primero del rango, que no es de nadie—,
  # porque este repositorio es público y el de una persona real no se escribe
  # aquí. Sirve igual: lo que se está midiendo es la IP, no la cuenta.
  #   429 → la IP está cortada; no hay nada que hacer desde un servidor.
  #   403 → la IP pasa y lo que falla es esa cuenta (privada o inexistente).
  #   200 → la IP pasa.
  sondeo-inventario:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ¿Le deja Steam a este runner leer un inventario?
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            code=$(curl -s --compressed -o /tmp/inv.json -w '%{http_code}' -A 'Mozilla/5.0' \
              'https://steamcommunity.com/inventory/76561197960265728/730/2?l=spanish&count=5')
            echo "intento $i -> $code  $(head -c 100 /tmp/inv.json)"
            sleep 3
          done

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # La medida que justifica que este trabajo exista, tomada cada vez. Nunca
      # falla el job: si sale 429, el paso siguiente lo dirá con sus propias
      # cifras y esto es la explicación que ahorra media hora de diagnóstico.
      - name: ¿Steam contesta a este runner?
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/po.json -w '%{http_code}' \
            --get --data-urlencode 'market_hash_name=AK-47 | Redline (Field-Tested)' \
            'https://steamcommunity.com/market/priceoverview/?appid=730&currency=3')
          echo "priceoverview desde este runner -> $code"
          head -c 200 /tmp/po.json; echo

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar
        working-directory: scripts/steam-prices
        run: npm ci --no-audit --no-fund

      - name: Refrescar precios
        working-directory: scripts/steam-prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_ITEMS: ${{ github.event.inputs.max_items || '1500' }}
        run: npm start

      # La foto del día se escribe SIEMPRE, aunque falten precios: el hueco se
      # cuenta en `missing_prices` y la gráfica lo dice. Saltársela dejaría un
      # agujero en la serie, que es peor — un día sin punto no se distingue de un
      # día a cero. Esto sí va en la función: no sale a Steam, solo suma.
      - name: Escribir la foto del día
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST "$URL/functions/v1/steam-market/snapshot" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY"
          echo
